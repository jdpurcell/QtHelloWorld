name: Build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: 'ubuntu-22.04'
            buildArch: 'X64'
            qtVersion: '6.9.3'
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: qtwebview qtpositioning qtlocation qtpdf
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
